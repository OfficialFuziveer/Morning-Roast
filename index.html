<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Valentine's day <3</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="parallax-section main-hero">
      <div class="overlay">
        <h1>Always You</h1>
      </div>
      <div class="scroll-indicator">↓</div>
    </section>

    <section class="love-note-section">
      <div id="typewriter-box" class="reveal"><span id="typewriter"></span><span class="cursor">|</span></div>
    </section>

    <section class="parallax-section middle-floral"></section>

    <section class="interaction-section">
      <div class="card-intro reveal">
        <h2>Reasons Why I Love You</h2>
        <p>(Click a card to reveal a secret)</p>
      </div>

      <div class="card-grid reveal">
        <div class="love-card">
          <div class="card-inner">
            <div class="card-front">❤</div>
            <div class="card-back">Your smile lights up even my darkest days.</div>
          </div>
        </div>
        <div class="love-card">
          <div class="card-inner">
            <div class="card-front">❤</div>
            <div class="card-back">The way your kindness touches everyone around you.</div>
          </div>
        </div>
        <div class="love-card">
          <div class="card-inner">
            <div class="card-front">❤</div>
            <div class="card-back">You are my safest place and my greatest adventure.</div>
          </div>
        </div>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
